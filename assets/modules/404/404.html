<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - CA Validation Tool</title>
    <link rel="stylesheet" href="/assets/modules/404/404.css">
</head>
<body>
    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:99999;display:flex;justify-content:center;align-items:center;transition:opacity 0.35s ease,visibility 0.35s ease;">
        <div class="loader-inner" style="display:flex;flex-direction:column;align-items:center;gap:18px;">
            <img src="/assets/ca validation tool logo.png" alt="CA Validation Tool" style="width:90px;height:90px;object-fit:contain;animation:logoPulse 1.5s ease-in-out infinite;">
            <div style="width:200px;height:6px;background:#e2e8f0;border-radius:999px;overflow:hidden;">
                <div id="loaderProgressBar" style="height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:999px;transition:width 0.1s linear;"></div>
            </div>
            <div id="loaderPercent" style="font-size:14px;font-weight:700;color:#64748b;">0%</div>
        </div>
    </div>
    <style>
        .page-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        @keyframes logoPulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>

    <h1>404</h1>
    <p>Oops! The page you're looking for doesn't exist.</p>
    <a href="/">Go Back Home</a>
    <script>
        (function() {
            const bar = document.getElementById('loaderProgressBar');
            const pct = document.getElementById('loaderPercent');
            const loader = document.getElementById('pageLoader');
            let progress = 0;
            
            const interval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 6;
                    if (progress > 90) progress = 90;
                    if (bar) bar.style.width = progress.toFixed(0) + '%';
                    if (pct) pct.textContent = progress.toFixed(0) + '%';
                }
            }, 200);
            
            function hideLoader() {
                clearInterval(interval);
                progress = 100;
                if (bar) bar.style.width = '100%';
                if (pct) pct.textContent = '100%';
                setTimeout(() => {
                    if (loader) loader.classList.add('hidden');
                }, 400);
            }

            if (document.readyState === 'complete') {
                hideLoader();
            } else {
                window.addEventListener('load', hideLoader);
            }
            
            // Fallback: forcefully hide after 3 seconds anyway
            setTimeout(hideLoader, 3000);
        })();
    </script>
</body>
</html>
